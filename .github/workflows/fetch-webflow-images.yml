# One-off: copy the course images off Webflow's CDN into the repo.
# Runs once when this file is pushed, then gets deleted.
name: Fetch Webflow images

on:
  push:
    branches: [claude/intelligent-meitner-9txxo3]
    paths: [.github/workflows/fetch-webflow-images.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download images
        run: |
          set -euo pipefail
          mkdir -p src/images/courses
          base=https://cdn.prod.website-files.com/60d2479a4b12f1c4e33a01e5
          old=https://uploads-ssl.webflow.com/60d2479a4b12f1c4e33a01e5
          while read -r name url; do
            curl -fsSL --retry 3 -o "src/images/courses/$name" "$url"
            echo "$name $(wc -c < "src/images/courses/$name") bytes $(file -b --mime-type "src/images/courses/$name")"
          done <<LIST
          yoga-bluveda.webp $base/6abc174337d252fd8844aeb3_Yoga%20BluVeda.webp
          yoga-bowls.webp $base/66d851ba8f441baf18929f9f_Bowls%20image%20large.webp
          yoga-basket.webp $base/66d856ee3471614eb83a2f7c_Yogabasket.webp
          ryt500.png $base/67d85b90087ca0b0c01df5ad_RYT500.png
          e-ryt200.png $base/67d85b93e21d7214af512ba5_E-RYT200.png
          craig-clark-holistic.webp $base/6a96c46a69c66bc613ceebb4_Craig%20Clark%20Holistic.webp
          holistic-bottom.webp $base/66d857afca4da54ce27d76e5_Holistic%20bottom.webp
          ayurvedic-massage.jpg $old/6373f36627e226ac007cfcf4_massage%201.jpg
          ayurvedic-massage-video-thumbnail.jpg $old/60d2479a4b12f14ac93a02c1_logan-weaver-tBmmA3pTciA-unsplash.jpg
          LIST

      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/images/courses
          git commit -m "Copy course images from Webflow's CDN into src/images/courses"
          git push
